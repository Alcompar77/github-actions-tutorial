name: main-workflow

env: {}

on:
  push:
    branches:
      - master
      - awesome-feature

  pull_request:
    branches:
      - master
      - awesome-feature

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.14"

      - name: Print go version
        run: go version

      - name: Run unit tests
        run: go test -v ./...

  # Build and release
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # Check out source code
      - name: Check out source code
        uses: docker/build-push-action@v1
        with: 
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ¢{{ secrets.DOCKER_PASSWORD}}
          repository: ${{ env.IMAGE_REPOSITORY}}
          tag_with_ref: true
          tag with_sha: true # sha-${GITHUB_SHA::7}
